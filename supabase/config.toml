# Configuración mínima de Supabase CLI para fw-os. Sin secretos:
# los valores se cargan con `supabase secrets set` (ver CONTRATO-OLA1.md).
project_id = "fw-os"

# Los webhooks externos (Meta, Shopify, Telegram) no mandan JWT de Supabase;
# cada función verifica su propia firma.
[functions.wa-webhook]
verify_jwt = false

[functions.shopify-webhook]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

[functions.pago-qr-webhook]
verify_jwt = false

# SIFEN (08-10-2026): los XSD (validar_xsd.ts) y las fuentes Inter del KuDE (kude.ts) viven fuera de
# functions/ y se leen con import.meta.url → hay que empaquetarlos. Rutas relativas a supabase/. [VERIFICAR
# en el primer deploy que el glob se respete; si no, kude.ts cae a Helvetica y el XSD se saltea con aviso en el log]
[functions.sifen-cola]
static_files = ["./sifen/xsd/*.xsd", "./sifen/fuentes/*.ttf"]

[functions.sifen-inutilizacion]
static_files = ["./sifen/xsd/*.xsd"]
